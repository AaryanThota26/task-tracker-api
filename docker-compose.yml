services:

  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2048

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"


  app:
    build:
      context: ./backend

    container_name: task-api

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis


  frontend:
    build:
      context: ./frontend

    container_name: task-frontend

    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

    ports:
      - "5173:5173"

    depends_on:
      - app


volumes:
  postgres_data: