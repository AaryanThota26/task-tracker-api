services:

  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2048

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"


  app:
    build: .
    container_name: task-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis


volumes:
  postgres_data: