apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: taskmonitor-ingress

  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: taskmonitor-cert

spec:
  rules:
  - host: taskmonitor.org
    http:
      paths:

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /openapi.json
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: www.taskmonitor.org
    http:
      paths:

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /openapi.json
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80