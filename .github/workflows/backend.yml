name: Backend CI/CD

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow triggers ONLY when files under the backend/ directory change.
# It will NOT run for frontend/, migrations/, or root-level config changes.
#
# Examples:
#   • backend/main.py changed          →  This workflow runs
#   • frontend/src/App.jsx changed     →  This workflow does NOT run
#   • migrations/versions/001.py added →  This workflow does NOT run
#   • k8s/ingress.yaml changed         →  This workflow does NOT run
#   • README.md changed                →  This workflow does NOT run
# ═══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  # Target GCP Artifact Registry repository
  # Verified against k8s/backend-deployment.yaml image path
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/task-tracker-499005/task-tracker
  IMAGE_NAME: task-api
  GKE_CLUSTER: task-tracker-cluster
  GKE_ZONE: asia-south1
  K8S_NAMESPACE: helm-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Google workload identity federation

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # 2. Authenticate to Google Cloud
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ───────────────────────────────────────────────────────────────────────
      # 3. Configure Docker for Artifact Registry
      # ───────────────────────────────────────────────────────────────────────
      - name: Configure Docker
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ───────────────────────────────────────────────────────────────────────
      # 4. Build and push backend image
      # ───────────────────────────────────────────────────────────────────────
      - name: Build and push
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "Pushed $IMAGE_TAG"

      # ───────────────────────────────────────────────────────────────────────
      # 5. Set up kubectl and deploy to GKE
      # ───────────────────────────────────────────────────────────────────────
      # ⚠️  NOTE: A Helm chart also exists in helm/task-tracker/.
      #    If Helm is the actual deployment mechanism, replace the steps below
      #    with: helm upgrade task-tracker ./helm/task-tracker --set backend.image.tag=<sha>
      #    The deployment name used here ("backend") matches k8s/backend-deployment.yaml.
      # ───────────────────────────────────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./helm/task-tracker

      - name: Deploy Backend with Helm
        run: |
          helm upgrade --install task-tracker ./helm/task-tracker \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set backend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set backend.image.tag=${{ github.sha }}

          kubectl rollout status deployment/backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s
