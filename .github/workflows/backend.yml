name: Backend CI/CD

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow triggers ONLY when files under the backend/ directory change.
#
# main branch    -> Deploys to Production (helm-demo)
# sandbox branch -> Deploys to Sandbox (sandbox)
#
# Examples:
#   • backend/main.py changed on main      → Deploy Production
#   • backend/main.py changed on sandbox   → Deploy Sandbox
#   • frontend/src/App.jsx changed         → This workflow does NOT run
#   • migrations/versions/001.py added     → This workflow does NOT run
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
      - sandbox
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

  pull_request:
    branches:
      - main
      - sandbox
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  # Target GCP Artifact Registry repository
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/task-tracker-499005/task-tracker
  IMAGE_NAME: task-api
  GKE_CLUSTER: task-tracker-cluster
  GKE_ZONE: asia-south1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # 2. Select deployment environment based on branch
      # ───────────────────────────────────────────────────────────────────────
      - name: Set deployment environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "RELEASE_NAME=task-tracker" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=helm-demo" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-prod.yaml" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "sandbox" ]; then
            echo "RELEASE_NAME=task-tracker-sandbox" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=sandbox" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-sandbox.yaml" >> $GITHUB_ENV
          fi

      # ───────────────────────────────────────────────────────────────────────
      # 3. Authenticate to Google Cloud
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ───────────────────────────────────────────────────────────────────────
      # 4. Configure Docker for Artifact Registry
      # ───────────────────────────────────────────────────────────────────────
      - name: Configure Docker
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ───────────────────────────────────────────────────────────────────────
      # 5. Build and push backend image
      # ───────────────────────────────────────────────────────────────────────
      - name: Build and push
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "Pushed $IMAGE_TAG"

      # ───────────────────────────────────────────────────────────────────────
      # 6. Set up kubectl and deploy to GKE
      # ───────────────────────────────────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./helm/task-tracker

      - name: Debug Helm values
        run: |
          echo "Release      : $RELEASE_NAME"
          echo "Namespace    : $K8S_NAMESPACE"
          echo "Values File  : $VALUES_FILE"
          echo "Backend Repo : ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Backend Tag  : ${{ github.sha }}"

          helm template $RELEASE_NAME ./helm/task-tracker \
            -f $VALUES_FILE \
            --set backend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set backend.image.tag=${{ github.sha }} | grep "image:"

      - name: Deploy Backend with Helm
        run: |
          helm upgrade --install $RELEASE_NAME ./helm/task-tracker \
            --namespace $K8S_NAMESPACE \
            --create-namespace \
            -f $VALUES_FILE \
            --set backend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set backend.image.tag=${{ github.sha }}

          kubectl rollout status deployment/${RELEASE_NAME}-backend \
            -n $K8S_NAMESPACE \
            --timeout=300s