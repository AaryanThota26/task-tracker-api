name: Backend CI/CD

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow triggers ONLY when files under the backend/ directory change.
#
# main branch    -> Deploys to Production (helm-demo)
# sandbox branch -> Deploys to Sandbox (sandbox)
#
# Examples:
#   • backend/main.py changed on main      → Deploy Production
#   • backend/main.py changed on sandbox   → Deploy Sandbox
#   • frontend/src/App.jsx changed         → This workflow does NOT run
#   • migrations/versions/001.py added     → This workflow does NOT run
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
      - sandbox
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

  pull_request:
    branches:
      - main
      - sandbox
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  # Target GCP Artifact Registry repository
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/task-tracker-499005/task-tracker
  IMAGE_NAME: task-api
  GKE_CLUSTER: task-tracker-cluster
  GKE_ZONE: asia-south1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # ───────────────────────────────────────────────────────────────────────
    # Concurrency: serialize deployments to the SAME Helm release.
    #
    # Both backend.yml and frontend.yml run `helm upgrade --install
    # $RELEASE_NAME` against the same release (task-tracker / task-tracker-
    # sandbox). When two runs target the same release concurrently, Helm
    # rejects the second with:
    #   UPGRADE FAILED: another operation (install/upgrade/rollback)
    #                   is in progress
    #
    # The group key mirrors the release-name mapping in the deploy step:
    #   push           → github.ref_name   (main | sandbox)
    #   pull_request   → github.head_ref   (PR source branch)
    # so any two runs targeting the same release share one queue, while
    # backend.yml and frontend.yml remain independent files/jobs.
    #
    # cancel-in-progress: false — never kill an in-flight Helm upgrade.
    # Aborting mid-upgrade can leave the release in a half-applied state
    # and recreate exactly the lock we are avoiding. Instead, queue the
    # newer run; it will execute with the latest commit once the current
    # run completes cleanly.
    # ───────────────────────────────────────────────────────────────────────
    concurrency:
      group: helm-deploy-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # 2. Select deployment environment based on branch
      # ───────────────────────────────────────────────────────────────────────
      - name: Set deployment environment
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            echo "RELEASE_NAME=task-tracker" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=helm-demo" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-prod.yaml" >> $GITHUB_ENV
          elif [ "$BRANCH" = "sandbox" ]; then
            echo "RELEASE_NAME=task-tracker-sandbox" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=sandbox" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-sandbox.yaml" >> $GITHUB_ENV
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi

      # ───────────────────────────────────────────────────────────────────────
      # 3. Authenticate to Google Cloud
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ───────────────────────────────────────────────────────────────────────
      # 4. Configure Docker for Artifact Registry
      # ───────────────────────────────────────────────────────────────────────
      - name: Configure Docker
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ───────────────────────────────────────────────────────────────────────
      # 5. Build and push backend image
      # ───────────────────────────────────────────────────────────────────────
      - name: Build and push
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "Pushed $IMAGE_TAG"

      # ───────────────────────────────────────────────────────────────────────
      # 6. Set up kubectl and deploy to GKE
      # ───────────────────────────────────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./helm/task-tracker

      - name: Debug Helm values
        run: |
          echo "Release      : $RELEASE_NAME"
          echo "Namespace    : $K8S_NAMESPACE"
          echo "Values File  : $VALUES_FILE"
          echo "Backend Repo : ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Backend Tag  : ${{ github.sha }}"

          helm template $RELEASE_NAME ./helm/task-tracker \
            -f $VALUES_FILE \
            --set backend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set backend.image.tag=${{ github.sha }} | grep "image:"

      # ───────────────────────────────────────────────────────────────────────
      # 7. Fetch currently deployed frontend image tag to preserve it
      #    This prevents resetting the frontend tag when deploying backend changes
      # ───────────────────────────────────────────────────────────────────────
      - name: Get current frontend image tag
        id: get-frontend-tag
        run: |
          # Try to get the currently deployed frontend tag from the Helm release
          CURRENT_FRONTEND_TAG=$(helm get values $RELEASE_NAME -n $K8S_NAMESPACE -o json 2>/dev/null | jq -r '.frontend.image.tag // empty')
          
          # If no release exists or tag not set, fall back to values file default
          if [ -z "$CURRENT_FRONTEND_TAG" ]; then
            CURRENT_FRONTEND_TAG=$(helm template $RELEASE_NAME ./helm/task-tracker -f $VALUES_FILE 2>/dev/null | grep -A1 'frontend:' | grep 'tag:' | awk '{print $2}' | head -1 | tr -d '"')
          fi
          
          # Default fallback if everything fails
          if [ -z "$CURRENT_FRONTEND_TAG" ]; then
            CURRENT_FRONTEND_TAG="v13"
          fi
          
          echo "CURRENT_FRONTEND_TAG=$CURRENT_FRONTEND_TAG" >> $GITHUB_OUTPUT
          echo "Preserving frontend image tag: $CURRENT_FRONTEND_TAG"

      - name: Deploy Backend with Helm
        run: |
          helm upgrade --install $RELEASE_NAME ./helm/task-tracker \
            --namespace $K8S_NAMESPACE \
            --create-namespace \
            -f $VALUES_FILE \
            --set backend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ steps.get-frontend-tag.outputs.CURRENT_FRONTEND_TAG }}

          kubectl rollout status deployment/${RELEASE_NAME}-backend \
            -n $K8S_NAMESPACE \
            --timeout=300s