name: Frontend CI/CD

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow triggers ONLY when files under the frontend/ directory change.
# It will NOT run for backend/, migrations/, or root-level config changes.
#
# Examples:
#   • frontend/src/App.jsx changed       →  This workflow runs
#   • backend/main.py changed            →  This workflow does NOT run
#   • migrations/versions/001.py added   →  This workflow does NOT run
#   • k8s/ingress.yaml changed           →  This workflow does NOT run
#   • README.md changed                  →  This workflow does NOT run
# ═══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - sandbox
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - sandbox
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  # Target GCP Artifact Registry repository
  # Verified against k8s/frontend-deployment.yaml image path
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/task-tracker-499005/task-tracker
  IMAGE_NAME: task-frontend
  GKE_CLUSTER: task-tracker-cluster
  GKE_ZONE: asia-south1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Google workload identity federation

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # 2. Set deployment environment
      # ───────────────────────────────────────────────────────────────────────
      - name: Set deployment environment
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            echo "RELEASE_NAME=task-tracker" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=helm-demo" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-prod.yaml" >> $GITHUB_ENV
          elif [ "$BRANCH" = "sandbox" ]; then
            echo "RELEASE_NAME=task-tracker-sandbox" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=sandbox" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-sandbox.yaml" >> $GITHUB_ENV
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi

      # ───────────────────────────────────────────────────────────────────────
      # 3. Authenticate to Google Cloud
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ───────────────────────────────────────────────────────────────────────
      # 4. Configure Docker for Artifact Registry
      # ───────────────────────────────────────────────────────────────────────
      - name: Configure Docker
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ───────────────────────────────────────────────────────────────────────
      # 5. Build and push frontend image
      # ───────────────────────────────────────────────────────────────────────
      - name: Build and push
        working-directory: frontend
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "Pushed $IMAGE_TAG"

      # ───────────────────────────────────────────────────────────────────────
      # 6. Set up kubectl and deploy to GKE
      # ───────────────────────────────────────────────────────────────────────
      # ⚠️  NOTE: A Helm chart also exists in helm/task-tracker/.
      #    This workflow automatically deploys:
      #      • main     → Production
      #      • sandbox  → Sandbox
      # ───────────────────────────────────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./helm/task-tracker
      - name: Debug Helm values
        run: |
          echo "Release      : $RELEASE_NAME"
          echo "Namespace    : $K8S_NAMESPACE"
          echo "Values File  : $VALUES_FILE"
          echo "Frontend Repo: ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Frontend Tag : ${{ github.sha }}"

          helm template $RELEASE_NAME ./helm/task-tracker \
            -f $VALUES_FILE \
            --set frontend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set frontend.image.tag=${{ github.sha }} | grep "image:"

      # ───────────────────────────────────────────────────────────────────────
      # 7. Fetch currently deployed backend image tag to preserve it
      #    This prevents resetting the backend tag when deploying frontend changes
      # ───────────────────────────────────────────────────────────────────────
      - name: Get current backend image tag
        id: get-backend-tag
        run: |
          # Try to get the currently deployed backend tag from the Helm release
          CURRENT_BACKEND_TAG=$(helm get values $RELEASE_NAME -n $K8S_NAMESPACE -o json 2>/dev/null | jq -r '.backend.image.tag // empty')
          
          # If no release exists or tag not set, fall back to values file default
          if [ -z "$CURRENT_BACKEND_TAG" ]; then
            CURRENT_BACKEND_TAG=$(helm template $RELEASE_NAME ./helm/task-tracker -f $VALUES_FILE 2>/dev/null | grep -A1 'backend:' | grep 'tag:' | awk '{print $2}' | head -1 | tr -d '"')
          fi
          
          # Default fallback if everything fails
          if [ -z "$CURRENT_BACKEND_TAG" ]; then
            CURRENT_BACKEND_TAG="v5"
          fi
          
          echo "CURRENT_BACKEND_TAG=$CURRENT_BACKEND_TAG" >> $GITHUB_OUTPUT
          echo "Preserving backend image tag: $CURRENT_BACKEND_TAG"

      - name: Deploy Frontend with Helm
        run: |
          helm upgrade --install $RELEASE_NAME ./helm/task-tracker \
            --namespace $K8S_NAMESPACE \
            --create-namespace \
            -f $VALUES_FILE \
            --set frontend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set backend.image.tag=${{ steps.get-backend-tag.outputs.CURRENT_BACKEND_TAG }}

          kubectl rollout status deployment/${RELEASE_NAME}-frontend \
            -n $K8S_NAMESPACE \
            --timeout=300s