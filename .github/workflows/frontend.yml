name: Frontend CI/CD

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow triggers ONLY when files under the frontend/ directory change.
# It will NOT run for backend/, migrations/, or root-level config changes.
#
# Examples:
#   • frontend/src/App.jsx changed       →  This workflow runs
#   • backend/main.py changed            →  This workflow does NOT run
#   • migrations/versions/001.py added   →  This workflow does NOT run
#   • k8s/ingress.yaml changed           →  This workflow does NOT run
#   • README.md changed                  →  This workflow does NOT run
# ═══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
      - sandbox
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
      - sandbox
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  # Target GCP Artifact Registry repository
  # Verified against k8s/frontend-deployment.yaml image path
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/task-tracker-499005/task-tracker
  IMAGE_NAME: task-frontend
  GKE_CLUSTER: task-tracker-cluster
  GKE_ZONE: asia-south1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Google workload identity federation

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # 2. Set deployment environment
      # ───────────────────────────────────────────────────────────────────────
      - name: Set deployment environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "RELEASE_NAME=task-tracker" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=helm-demo" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-prod.yaml" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "sandbox" ]; then
            echo "RELEASE_NAME=task-tracker-sandbox" >> $GITHUB_ENV
            echo "K8S_NAMESPACE=sandbox" >> $GITHUB_ENV
            echo "VALUES_FILE=helm/task-tracker/values-sandbox.yaml" >> $GITHUB_ENV
          fi

      # ───────────────────────────────────────────────────────────────────────
      # 3. Authenticate to Google Cloud
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ───────────────────────────────────────────────────────────────────────
      # 4. Configure Docker for Artifact Registry
      # ───────────────────────────────────────────────────────────────────────
      - name: Configure Docker
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ───────────────────────────────────────────────────────────────────────
      # 5. Build and push frontend image
      # ───────────────────────────────────────────────────────────────────────
      - name: Build and push
        working-directory: frontend
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "Pushed $IMAGE_TAG"

      # ───────────────────────────────────────────────────────────────────────
      # 6. Set up kubectl and deploy to GKE
      # ───────────────────────────────────────────────────────────────────────
      # ⚠️  NOTE: A Helm chart also exists in helm/task-tracker/.
      #    This workflow automatically deploys:
      #      • main     → Production
      #      • sandbox  → Sandbox
      # ───────────────────────────────────────────────────────────────────────
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./helm/task-tracker

      - name: Deploy Frontend with Helm
        run: |
          helm upgrade --install $RELEASE_NAME ./helm/task-tracker \
            --namespace $K8S_NAMESPACE \
            --create-namespace \
            -f $VALUES_FILE \
            --set frontend.image.repository=${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set frontend.image.tag=${{ github.sha }}

          kubectl rollout status deployment/${RELEASE_NAME}-frontend \
            -n $K8S_NAMESPACE \
            --timeout=300s