name: Database Migrations

# ═══════════════════════════════════════════════════════════════════════════════
# TRIGGER CONDITIONS
# ═══════════════════════════════════════════════════════════════════════════════
# This workflow runs when Alembic migration files or related backend migration
# configuration changes. It authenticates to GCP, connects to the GKE cluster,
# and executes the database migration using the Helm migration Job.
# ═══════════════════════════════════════════════════════════════════════════════

# Examples:
#   • backend/alembic/versions/001_init.py changed → This workflow runs
#   • backend/models.py changed                    → This workflow runs
#   • backend/main.py changed                      → This workflow does NOT run
#   • frontend/src/App.jsx changed                 → This workflow does NOT run
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
      - sandbox
    paths:
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/models.py'
      - 'backend/requirements.txt'
      - '.github/workflows/db-migrations.yml'

  pull_request:
    branches:
      - main
      - sandbox
    paths:
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/models.py'
      - 'backend/requirements.txt'
      - '.github/workflows/db-migrations.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # ───────────────────────────────────────────────────────────────────────
      # 1. Checkout repository
      # ───────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # 2. Determine target environment
      # ───────────────────────────────────────────────────────────────────────
      - name: Set deployment environment
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi

          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            echo "ENVIRONMENT=Production" >> $GITHUB_ENV
            echo "NAMESPACE=helm-demo" >> $GITHUB_ENV
          elif [ "$BRANCH" = "sandbox" ]; then
            echo "ENVIRONMENT=Sandbox" >> $GITHUB_ENV
            echo "NAMESPACE=sandbox" >> $GITHUB_ENV
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi

      # ───────────────────────────────────────────────────────────────────────
      # 3. Authenticate to Google Cloud
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: task-tracker-cluster
          location: asia-south1

      # ───────────────────────────────────────────────────────────────────────
      # 4. Wait for backend deployment
      # ───────────────────────────────────────────────────────────────────────
      - name: Wait for backend deployment
        run: |
          if [ "$NAMESPACE" = "helm-demo" ]; then
            DEPLOYMENT=task-tracker-backend
          else
            DEPLOYMENT=task-tracker-sandbox-backend
          fi

          kubectl rollout status deployment/$DEPLOYMENT \
            -n $NAMESPACE \
            --timeout=300s

      # ───────────────────────────────────────────────────────────────────────
      # 5. Run Alembic migration
      # ───────────────────────────────────────────────────────────────────────
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Migration Job
        run: |
          if [ "$NAMESPACE" = "helm-demo" ]; then
            RELEASE_NAME=task-tracker
            VALUES_FILE=helm/task-tracker/values-prod.yaml
          else
            RELEASE_NAME=task-tracker-sandbox
            VALUES_FILE=helm/task-tracker/values-sandbox.yaml
          fi

          helm upgrade --install $RELEASE_NAME ./helm/task-tracker \
            --namespace $NAMESPACE \
            --create-namespace \
            -f $VALUES_FILE \
            --set migration.enabled=true \
            --set backend.image.tag=${{ github.sha }}
      # ───────────────────────────────────────────────────────────────────────
      # 6. Verify Alembic version
      # ───────────────────────────────────────────────────────────────────────
      - name: Wait for Migration Job
        run: |
          JOB=$(kubectl get jobs -n $NAMESPACE \
            -l job-type=migration \
            -o jsonpath="{.items[-1:].metadata.name}")

          echo "Migration Job: $JOB"

          kubectl wait \
            --for=condition=complete \
            job/$JOB \
            -n $NAMESPACE \
            --timeout=300s