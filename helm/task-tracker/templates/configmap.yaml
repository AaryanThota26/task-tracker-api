apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-tracker.fullname" . }}-config
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "task-tracker.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database }}
  DB_USER: {{ .Values.postgres.user }}

  REDIS_HOST: {{ include "task-tracker.fullname" . }}-redis
  REDIS_PORT: "6379"
