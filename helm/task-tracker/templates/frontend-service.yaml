apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend
  labels:
    app: frontend
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: {{ .Values.frontend.service.targetPort }}
