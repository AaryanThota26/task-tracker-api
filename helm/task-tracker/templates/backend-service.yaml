apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-backend
  labels:
    app: backend
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.port }}
